<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progresso do Projeto — PaperWorlds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: rgba(17, 24, 39, 0.7);
            --bg-card-hover: rgba(30, 41, 59, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --concluido: #10b981;
            --concluido-bg: rgba(16, 185, 129, 0.12);
            --concluido-border: rgba(16, 185, 129, 0.3);
            --andamento: #f59e0b;
            --andamento-bg: rgba(245, 158, 11, 0.12);
            --andamento-border: rgba(245, 158, 11, 0.3);
            --pendente: #64748b;
            --pendente-bg: rgba(100, 116, 139, 0.12);
            --pendente-border: rgba(100, 116, 139, 0.3);
            --shadow-lg: 0 20px 60px -15px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* Background animado */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 40px 24px 80px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 60px;
            padding: 48px 32px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.5), transparent);
        }

        .header-icon {
            font-size: 56px;
            margin-bottom: 16px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header h1 {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header .subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-bottom: 24px;
        }

        .header-meta {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .meta-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .meta-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--concluido);
            box-shadow: 0 0 8px var(--concluido);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Stats Overview */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 48px;
        }

        .stat-card {
            padding: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-glow);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--stat-color);
        }

        .stat-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 800;
            color: var(--stat-color);
            font-family: 'JetBrains Mono', monospace;
            line-height: 1;
        }

        .stat-sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Filtros */
        .filters {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 100px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
        }

        .filter-count {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 100px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Categorias */
        .category {
            margin-bottom: 48px;
            animation: fadeInUp 0.6s ease backwards;
        }

        .category:nth-child(1) { animation-delay: 0.1s; }
        .category:nth-child(2) { animation-delay: 0.2s; }
        .category:nth-child(3) { animation-delay: 0.3s; }
        .category:nth-child(4) { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .category-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--cat-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 20px -8px var(--cat-color);
        }

        .category-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .category-count {
            margin-left: auto;
            font-size: 13px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Items Grid */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .item {
            padding: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            backdrop-filter: blur(20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .item:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--item-color);
            transition: width 0.3s ease;
        }

        .item:hover::before {
            width: 4px;
        }

        .item-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .item-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .item-description {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .status-badge.concluido {
            background: var(--concluido-bg);
            color: var(--concluido);
            border: 1px solid var(--concluido-border);
        }

        .status-badge.em_andamento {
            background: var(--andamento-bg);
            color: var(--andamento);
            border: 1px solid var(--andamento-border);
        }

        .status-badge.pendente {
            background: var(--pendente-bg);
            color: var(--pendente);
            border: 1px solid var(--pendente-border);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .status-badge.em_andamento .status-dot {
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 16px;
            border: 3px solid var(--border);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 60px;
            padding: 24px;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid var(--border);
        }

        .footer a {
            color: #a5b4fc;
            text-decoration: none;
        }

        /* Responsivo */
        @media (max-width: 640px) {
            .container {
                padding: 20px 16px 60px;
            }
            .header {
                padding: 32px 20px;
            }
            .items-grid {
                grid-template-columns: 1fr;
            }
            .stat-value {
                font-size: 28px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header" id="header">
            <div class="header-icon" id="headerIcon">📊</div>
            <h1 id="headerTitle">Carregando...</h1>
            <p class="subtitle" id="headerSubtitle"></p>
            <div class="header-meta" id="headerMeta"></div>
        </header>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="filters" id="filters"></div>

        <main id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Carregando dados do projeto...</p>
            </div>
        </main>

        <footer class="footer">
            <p>Atualizado automaticamente a partir de <code style="color:#a5b4fc;">dados.json</code></p>
        </footer>
    </div>

    <script>
        // Dados de fallback caso o JSON não seja carregado (ex: file:// sem servidor)
        const FALLBACK_DATA = {
            metadata: {
                titulo: "Atualização de Progresso",
                subtitulo: "Projeto de Jogo",
                versao: "1.3.1",
                data_atualizacao: "2026-11-26",
                icone: "📊"
            },
            categorias: []
        };

        const STATUS_CONFIG = {
            concluido: { label: 'Concluído', icon: '✓' },
            em_andamento: { label: 'Em Andamento', icon: '⚡' },
            pendente: { label: 'Pendente', icon: '⏳' }
        };

        const STATUS_COLORS = {
            concluido: 'var(--concluido)',
            em_andamento: 'var(--andamento)',
            pendente: 'var(--pendente)'
        };

        let currentData = null;
        let currentFilter = 'all';

        async function loadData() {
            try {
                const response = await fetch('dados.json');
                if (!response.ok) throw new Error('JSON não encontrado');
                return await response.json();
            } catch (err) {
                console.warn('Usando dados de fallback:', err.message);
                return FALLBACK_DATA;
            }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('pt-BR', {
                day: '2-digit',
                month: 'long',
                year: 'numeric'
            });
        }

        function renderHeader(metadata) {
            document.getElementById('headerIcon').textContent = metadata.icone;
            document.getElementById('headerTitle').textContent = metadata.titulo;
            document.getElementById('headerSubtitle').textContent = metadata.subtitulo;
            
            const meta = document.getElementById('headerMeta');
            meta.innerHTML = `
                <span class="meta-badge">
                    <span class="dot"></span>
                    v${metadata.versao}
                </span>
                <span class="meta-badge">📅 ${formatDate(metadata.data_atualizacao)}</span>
            `;
        }

        function countItems(data) {
            const counts = { total: 0, concluido: 0, em_andamento: 0, pendente: 0 };
            data.categorias.forEach(cat => {
                cat.itens.forEach(item => {
                    counts.total++;
                    counts[item.status]++;
                });
            });
            return counts;
        }

        function renderStats(counts) {
            const percent = Math.round((counts.concluido / counts.total) * 100);
            const stats = [
                { label: 'Total de Itens', value: counts.total, sub: 'tarefas registradas', color: '#6366f1' },
                { label: 'Concluídos', value: counts.concluido, sub: `${percent}% do total`, color: 'var(--concluido)' },
                { label: 'Em Andamento', value: counts.em_andamento, sub: 'sendo desenvolvidos', color: 'var(--andamento)' },
                { label: 'Pendentes', value: counts.pendente, sub: 'aguardando início', color: 'var(--pendente)' }
            ];
            
            document.getElementById('statsGrid').innerHTML = stats.map(s => `
                <div class="stat-card" style="--stat-color: ${s.color}">
                    <div class="stat-label">${s.label}</div>
                    <div class="stat-value">${s.value}</div>
                    <div class="stat-sub">${s.sub}</div>
                </div>
            `).join('');
        }

        function renderFilters(counts) {
            const filters = [
                { id: 'all', label: 'Todos', count: counts.total },
                { id: 'concluido', label: '✓ Concluídos', count: counts.concluido },
                { id: 'em_andamento', label: '⚡ Em Andamento', count: counts.em_andamento },
                { id: 'pendente', label: '⏳ Pendentes', count: counts.pendente }
            ];
            
            document.getElementById('filters').innerHTML = filters.map(f => `
                <button class="filter-btn ${f.id === currentFilter ? 'active' : ''}" data-filter="${f.id}">
                    ${f.label}
                    <span class="filter-count">${f.count}</span>
                </button>
            `).join('');

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentFilter = btn.dataset.filter;
                    renderFilters(counts);
                    renderCategories(currentData);
                });
            });
        }

        function renderCategories(data) {
            const content = document.getElementById('content');
            let html = '';
            let hasItems = false;

            data.categorias.forEach(cat => {
                const filteredItems = currentFilter === 'all' 
                    ? cat.itens 
                    : cat.itens.filter(item => item.status === currentFilter);
                
                if (filteredItems.length === 0) return;
                hasItems = true;

                html += `
                    <section class="category" style="--cat-color: ${cat.cor}">
                        <div class="category-header">
                            <div class="category-icon">${cat.icone}</div>
                            <h2 class="category-title">${cat.nome}</h2>
                            <span class="category-count">${filteredItems.length} ${filteredItems.length === 1 ? 'item' : 'itens'}</span>
                        </div>
                        <div class="items-grid">
                            ${filteredItems.map(item => `
                                <article class="item" style="--item-color: ${STATUS_COLORS[item.status]}">
                                    <div class="item-header">
                                        <h3 class="item-title">${item.titulo}</h3>
                                        <span class="status-badge ${item.status}">
                                            <span class="status-dot"></span>
                                            ${STATUS_CONFIG[item.status].label}
                                        </span>
                                    </div>
                                    <p class="item-description">${item.descricao}</p>
                                </article>
                            `).join('')}
                        </div>
                    </section>
                `;
            });

            if (!hasItems) {
                html = `
                    <div class="empty-state">
                        <p style="font-size: 48px; margin-bottom: 12px;">🔍</p>
                        <p>Nenhum item encontrado para este filtro.</p>
                    </div>
                `;
            }

            content.innerHTML = html;
        }

        async function init() {
            currentData = await loadData();
            renderHeader(currentData.metadata);
            const counts = countItems(currentData);
            renderStats(counts);
            renderFilters(counts);
            renderCategories(currentData);
        }

        init();
    </script>
</body>
</html>
